name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello from github actions"
      - name: Get the code
        uses: actions/checkout@v3
      - name: List the files
        run: ls -la
      - name: Show current directory
        run: pwd
      - name: Good bye
        run: echo "good bye from github actions"
      - name: check index.html contain h1
        run: grep "<h1>" index.html
